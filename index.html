<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Princess Day, Anshika</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400&display=swap');

        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #1a0b16;
            color: #fdf5f6;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .hero-container {
            max-width: 800px;
            padding: 40px;
            background: linear-gradient(145deg, #2a1122 0%, #1a0b16 100%);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid #4a253f;
            margin: 20px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.2rem;
            color: #e8b4b8;
            margin-bottom: 10px;
            letter-spacing: 1px;
            line-height: 1.2;
        }

        .hero-image {
            width: 100%;
            max-width: 350px;
            height: auto;
            border-radius: 15px;
            margin: 30px 0;
            box-shadow: 0 10px 30px rgba(232, 180, 184, 0.15);
            border: 2px solid #e8b4b8;
        }

        p.welcome-text {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #d8c3cb;
            margin-bottom: 40px;
            font-weight: 300;
            padding: 0 20px;
        }

        .next-btn {
            display: inline-block;
            padding: 15px 40px;
            font-size: 1.1rem;
            color: #1a0b16;
            background-color: #e8b4b8;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .next-btn:hover {
            background-color: #fdf5f6;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(232, 180, 184, 0.4);
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .hero-container { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <h1>Happy Princess Day,<br>Anshika 💕😝</h1>
        
        <img src="image_0dcf10.jpg" alt="Anshika and Pratik" class="hero-image">
        
        <p class="welcome-text">
            To my beautiful jaanu 🫶,<br><br>
            You make every single day feel like magic. I built this entirely for you, because the queen of my heart deserves nothing less than her own digital kingdom. Thank you for being my favorite person.
        </p>

        <a href="gallery.html" class="next-btn">Enter Your Kingdom ✨</a>
    </div>

</body>
</html>
