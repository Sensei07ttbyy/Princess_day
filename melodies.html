<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Princess's Melodies</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #1a0b16;
            color: #fdf5f6;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            background-image: radial-gradient(circle at 50% 100%, #2a1122 0%, #1a0b16 100%);
        }

        header {
            margin-top: 40px;
            margin-bottom: 30px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: #e8b4b8;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #d8c3cb;
            font-size: 1.1rem;
            font-weight: 300;
            max-width: 500px;
            margin: 0 auto 30px;
            padding: 0 20px;
            line-height: 1.6;
        }

        .music-container {
            background: linear-gradient(145deg, #2a1122 0%, #1a0b16 100%);
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 85%;
            margin: 0 auto 40px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            border: 1px solid #4a253f;
            position: relative;
        }

        .music-container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #e8b4b8, #4a253f, #e8b4b8);
            z-index: -1;
            border-radius: 22px;
            opacity: 0.3;
            animation: pulse 3s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.2; transform: scale(1); }
            100% { opacity: 0.5; transform: scale(1.02); }
        }

        .next-btn {
            display: inline-block;
            padding: 15px 40px;
            font-size: 1.1rem;
            color: #1a0b16;
            background-color: #e8b4b8;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-bottom: 50px;
        }

        .next-btn:hover {
            background-color: #fdf5f6;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(232, 180, 184, 0.4);
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .music-container { padding: 20px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>The Princess's Melodies</h1>
        <p class="subtitle">Some words are best spoken through a melody. I chose this song because every time I hear it, I think of you, Jaanu.</p>
    </header>

    <div class="music-container">
        <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/7rbgQLGePcwmOnL4KfnnD6?utm_source=generator&theme=0" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>

    <a href="decree.html" class="next-btn">View The Royal Decree ❤️</a>

</body>
</html>
